name: Build & Deploy

on:
  # Project/skill/resume data is fetched from GitHub at build time, so the live
  # site updates on a rebuild: a push to main, or a manual run from the Actions
  # tab. (No background poller — see the removed portfolio-watcher.)
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Use the built-in docker driver (no moby/buildkit pull from Docker Hub,
      # which was timing out on the runners). It does not support the GHA cache
      # backend — that's fine: building uncached means fetch-portfolio.ts always
      # re-runs, so project/config data is always fresh on every build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          # PORTFOLIO_GITHUB_TOKEN is a PAT with repo scope — passed as a
          # BuildKit secret so it's available to fetch-portfolio.ts during
          # `npm run build` without being baked into any image layer.
          # Without it the script falls back to the public GitHub API (public
          # repos only, rate-limited to 60 req/hr).
          secrets: |
            GITHUB_TOKEN=${{ secrets.PORTFOLIO_GITHUB_TOKEN }}

      - name: Deploy via Komodo (signed webhook → pull + redeploy stack "portfolio-coding")
        env:
          SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          body=$(printf '{"ref":"refs/heads/main","after":"%s","repository":{"full_name":"%s"}}' "$GITHUB_SHA" "$GITHUB_REPOSITORY")
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')"
          code=$(curl -s -o /tmp/resp -w '%{http_code}' --max-time 30 -X POST \
            "https://hooks.joeldettinger.de/listener/github/stack/portfolio-coding/deploy" \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: $sig" --data "$body")
          cat /tmp/resp; echo; echo "HTTP $code"
          [ "$code" -lt 300 ]
